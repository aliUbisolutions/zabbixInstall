# Zabbix Agent 2 UserParameters — TCP connection monitoring
# Drop this file into /etc/zabbix/zabbix_agent2.d/
# then: systemctl restart zabbix-agent2

# ── Host-level connections ────────────────────────────────────────────────────
UserParameter=connections.in.discover,/etc/zabbix/scripts/connections.sh discover in
UserParameter=connections.out.discover,/etc/zabbix/scripts/connections.sh discover out
UserParameter=connections.in.count[*],/etc/zabbix/scripts/connections.sh count in $1
UserParameter=connections.out.count[*],/etc/zabbix/scripts/connections.sh count out $1
UserParameter=connections.in.ports[*],/etc/zabbix/scripts/connections.sh ports in $1
UserParameter=connections.out.ports[*],/etc/zabbix/scripts/connections.sh ports out $1
UserParameter=connections.in.states[*],/etc/zabbix/scripts/connections.sh states in $1
UserParameter=connections.out.states[*],/etc/zabbix/scripts/connections.sh states out $1

# ── Docker container connections ──────────────────────────────────────────────
# Keys use two arguments: [container_name,ip]
# Discovery keys use one argument: [container_name]
UserParameter=connections.container.in.discover[*],/etc/zabbix/scripts/connections.sh --container $1 discover in
UserParameter=connections.container.out.discover[*],/etc/zabbix/scripts/connections.sh --container $1 discover out
UserParameter=connections.container.in.count[*],/etc/zabbix/scripts/connections.sh --container $1 count in $2
UserParameter=connections.container.out.count[*],/etc/zabbix/scripts/connections.sh --container $1 count out $2
UserParameter=connections.container.in.ports[*],/etc/zabbix/scripts/connections.sh --container $1 ports in $2
UserParameter=connections.container.out.ports[*],/etc/zabbix/scripts/connections.sh --container $1 ports out $2
UserParameter=connections.container.in.states[*],/etc/zabbix/scripts/connections.sh --container $1 states in $2
UserParameter=connections.container.out.states[*],/etc/zabbix/scripts/connections.sh --container $1 states out $2

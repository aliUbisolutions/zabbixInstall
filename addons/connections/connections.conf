# Zabbix Agent 2 UserParameters — TCP connection monitoring
# Drop this file into /etc/zabbix/zabbix_agent2.d/
# then: systemctl restart zabbix-agent2

# LLD discovery: returns JSON array of currently connected remote IPs
UserParameter=connections.discover,/etc/zabbix/scripts/connections.sh discover

# Per-IP metrics (LLD item prototypes use {#IP} as the argument)
UserParameter=connections.count[*],/etc/zabbix/scripts/connections.sh count $1
UserParameter=connections.ports[*],/etc/zabbix/scripts/connections.sh ports $1
UserParameter=connections.states[*],/etc/zabbix/scripts/connections.sh states $1

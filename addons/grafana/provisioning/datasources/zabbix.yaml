apiVersion: 1

datasources:
  - name: Zabbix
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    isDefault: true
    jsonData:
      url: ${ZABBIX_API_URL}
      username: ${ZABBIX_API_USER:-Admin}
      trends: true
      trendsFrom: 7d
      trendsRange: 4d
      cacheTTL: 1m
    secureJsonData:
      password: ${ZABBIX_API_PASSWORD:-zabbix}
